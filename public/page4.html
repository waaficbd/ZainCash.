<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>زين كاش العراق - طلب القرض (الملخص)</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --zc-purple: #6A1B9A;          /* ZainCash Signature Deep Purple */
            --zc-magenta: #C2185B;         /* ZainCash Vibrant Magenta Accent */
            --zc-gradient: linear-gradient(135deg, #4A148C 0%, #8E24AA 55%, #D81B60 100%);
            --zc-dark: #1E102B;            /* Deep Plum Dark Text */
            --zc-accent-purple: #7B1FA2;
            --bg-color: #F7F5F9;
            --card-bg: #FFFFFF;
            --calc-bg: #F5EEF8;            /* Soft Lavender Tint */
            --calc-border: #E1BEE7;
            --text-main: #1E102B;
            --text-muted: #6A5D75;
            --input-border: #E0D7E8;
            --btn-gray: #EDE7F6;
            --btn-gray-text: #4A148C;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
        }

        /* Top Header Navigation bar */
        .app-header {
            width: 100%;
            background: var(--zc-gradient);
            height: 62px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 3px 10px rgba(74, 20, 140, 0.25);
        }

        .back-btn-top {
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            gap: 6px;
        }

        .header-title .region {
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .menu-icon {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-icon span {
            display: block;
            width: 22px;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
        }

        /* Card Layout */
        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 440px;
            margin: 20px 0 30px;
            padding: 30px 22px;
            border-radius: 20px;
            box-shadow: 0 6px 25px rgba(106, 27, 154, 0.08);
            border: 1px solid #EDE7F6;
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 24px;
            color: var(--text-main);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 800;
        }

        .subtext {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Step Progress Bar (All 3 Steps Active) */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 0 auto 28px;
            width: 100%;
        }

        .step-bar {
            flex: 1;
            height: 6px;
            background-color: #E0D7E8;
            border-radius: 3px;
        }

        .step-bar.active {
            background: var(--zc-gradient);
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            text-align: right;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 800;
            color: var(--zc-dark);
            margin-bottom: 8px;
        }

        .form-control {
            font-size: 15px;
            padding: 14px 16px;
            border: 2px solid var(--input-border);
            border-radius: 12px;
            background-color: #ffffff;
            color: var(--text-main);
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
            font-weight: 600;
            direction: rtl;
        }

        .form-control::placeholder {
            color: #A095A8;
        }

        .form-control:focus {
            border-color: var(--zc-magenta);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231E102B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: left 16px center;
            background-size: 14px;
            padding-left: 40px;
            cursor: pointer;
        }

        /* Summary Box with Magenta Accent Border */
        .summary-card {
            background-color: var(--calc-bg);
            border-right: 4px solid var(--zc-magenta);
            padding: 18px 16px;
            border-radius: 12px;
            margin: 10px 0 22px;
            border-top: 1px solid var(--calc-border);
            border-left: 1px solid var(--calc-border);
            border-bottom: 1px solid var(--calc-border);
        }

        .summary-card h3 {
            margin: 0 0 14px 0;
            font-size: 15px;
            font-weight: 800;
            color: var(--zc-purple);
            text-align: right;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--calc-border);
        }

        .summary-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .summary-label {
            color: var(--text-muted);
            font-size: 13.5px;
            font-weight: 700;
        }

        .summary-value {
            font-weight: 800;
            font-size: 13.5px;
            color: var(--text-main);
            text-align: left;
            direction: ltr;
        }

        .summary-value.text-arabic {
            direction: rtl;
        }

        /* Button Container */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-prev {
            background-color: var(--btn-gray);
            color: var(--btn-gray-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }

        .btn-prev:hover {
            background-color: #D1C4E9;
        }

        .btn-next {
            background: var(--zc-gradient);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 14px rgba(142, 36, 170, 0.35);
        }

        .btn-next:active {
            opacity: 0.92;
            transform: scale(0.99);
        }

        /* Bottom Footer Banner */
        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: auto;
            font-weight: 600;
        }
    </style>
</head>

<body>

<!-- ZainCash Header Navigation Bar -->
<div class="app-header">
    <a onclick="goBack()" class="back-btn-top">← رجوع</a>
    <div class="header-title">
        <span>زين كاش</span><span class="region">العراق</span>
    </div>
    <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="card">
    <h1 class="main-title">طلب القرض</h1>
    <div class="subtext">الخطوة 3 من 3</div>

    <!-- Step Bar Progress Indicators (All 3 Active) -->
    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
    </div>

    <!-- Form & Dynamic Summary -->
    <form id="step3Form" onsubmit="submitForm(event)">
        <div class="form-group">
            <label for="jobStatus">الحالة الوظيفية</label>
            <select id="jobStatus" class="form-control" required>
                <option value="موظف" selected>موظف</option>
                <option value="عمل حر / تجارة حرة">عمل حر / تجارة حرة</option>
                <option value="طالب">طالب</option>
                <option value="بدون عمل">بدون عمل</option>
                <option value="متقاعد">متقاعد</option>
            </select>
        </div>

        <div class="form-group">
            <label for="income">متوسط الدخل الشهري (IQD)</label>
            <input type="number" id="income" class="form-control" placeholder="مثال: 750000" required style="direction: ltr; text-align: right;">
        </div>

        <div class="summary-card">
            <h3>ملخص الطلب</h3>

            <div class="summary-row">
                <span class="summary-label">مبلغ القرض:</span>
                <span class="summary-value" id="sumAmount">--</span>
            </div>

            <div class="summary-row">
                <span class="summary-label">مدة السداد:</span>
                <span class="summary-value text-arabic" id="sumDuration">--</span>
            </div>

            <div class="summary-row">
                <span class="summary-label">غرض القرض:</span>
                <span class="summary-value text-arabic" id="sumPurpose">--</span>
            </div>

            <div class="summary-row">
                <span class="summary-label">المتقدم:</span>
                <span class="summary-value text-arabic" id="sumName">--</span>
            </div>

            <div class="summary-row">
                <span class="summary-label">رقم المحفظة:</span>
                <span class="summary-value" id="sumPhone">--</span>
            </div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-prev" onclick="goBack()">السابق</button>
            <button type="submit" class="btn-next">إرسال الطلب</button>
        </div>
    </form>
</div>

<!-- Footer -->
<div class="footer-banner">
    © 2026 زين كاش العراق (ZainCash Iraq) - جميع الحقوق محفوظة
</div>

<script>
window.onload = () => {
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();   
        tg.expand();
    }

    // Retrieve storage items from Step 1 and Step 2
    const amount = localStorage.getItem('appliedAmount') || localStorage.getItem('amount');
    const term = localStorage.getItem('appliedTerm') || localStorage.getItem('loanDuration');
    const purpose = localStorage.getItem('appliedPurpose') || localStorage.getItem('loanPurpose');
    const fName = localStorage.getItem('firstName') || "";
    const lName = localStorage.getItem('lastName') || "";
    const phone = localStorage.getItem('phone') || "";

    // Format & Populate Summary
    if (amount) {
        const numAmount = Number(amount.toString().replace(/\D/g, ''));
        document.getElementById('sumAmount').innerText = numAmount 
            ? `${numAmount.toLocaleString('en-US')} IQD` 
            : `${amount} IQD`;
    } else {
        document.getElementById('sumAmount').innerText = "--";
    }

    document.getElementById('sumDuration').innerText = term ? term : "--";
    document.getElementById('sumPurpose').innerText = purpose ? purpose : "--";
    document.getElementById('sumName').innerText = `${fName} ${lName}`.trim() || "--";
    document.getElementById('sumPhone').innerText = phone ? `+964 ${phone}` : "--";
};

function submitForm(event) {
    event.preventDefault();
    const tg = window.Telegram?.WebApp;
    const incomeVal = document.getElementById('income').value.trim();

    if (!incomeVal) {
        alert("يرجى إدخال متوسط الدخل الشهري.");
        return;
    }

    const data = {
        amount: localStorage.getItem('appliedAmount') || localStorage.getItem('amount'),
        duration: localStorage.getItem('appliedTerm') || localStorage.getItem('loanDuration'),
        purpose: localStorage.getItem('appliedPurpose') || localStorage.getItem('loanPurpose'),
        firstName: localStorage.getItem('firstName'),
        lastName: localStorage.getItem('lastName'),
        email: localStorage.getItem('email'),
        phone: localStorage.getItem('phone'),
        jobStatus: document.getElementById('jobStatus').value,
        income: incomeVal,
        currency: "IQD"
    };

    // Save final submission profile details
    localStorage.setItem('jobStatus', data.jobStatus);
    localStorage.setItem('income', incomeVal);

    if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(data));
        setTimeout(() => {
            window.location.href = "/page5";
        }, 300);
    } else {
        console.log("Submitted payload:", data);
        window.location.href = "/page5";
    }
}

function goBack() {
    window.location.href = "/page3";
}
</script>

</body>
</html>
